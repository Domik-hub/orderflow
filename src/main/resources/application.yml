spring:
  application:
    name: orderflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderflow}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  cache-enabled: ${CACHE_ENABLED:true}
  jwt-secret: ${JWT_SECRET:}
  jwt-issuer: orderflow
  token-seconds: 3600
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
management:
  health:
    redis:
      enabled: ${CACHE_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
